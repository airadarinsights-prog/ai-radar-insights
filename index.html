<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Radar Insights</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      background: #f5f7fa;
      color: #111;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .status {
      padding: 12px;
      background: white;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .source {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .card h3 {
      margin: 5px 0 10px;
      font-size: 18px;
    }

    .card p {
      line-height: 1.5;
      color: #444;
    }

    .link {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .error {
      color: #b00020;
      background: #fff0f0;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>AI Radar Insights</h1>
  <p class="subtitle">
    AI trends, tools and developments — updated automatically.
  </p>

  <div id="status" class="status">
    Loading latest AI insights...
  </div>

  <div id="content" class="grid"></div>

  <script>
    async function loadRadar() {
      const status = document.getElementById("status");
      const content = document.getElementById("content");

      try {
        const response = await fetch("/api/radar");
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          status.textContent = "No AI news available right now.";
          return;
        }

        status.textContent =
          "Latest AI Radar • " + data.items.length + " sources";

        content.innerHTML = data.items.map(item => `
          <article class="card">

            <div class="source">
              ${escapeHtml(item.source || "AI Radar")}
            </div>

            <h3>
              ${escapeHtml(item.title || "Untitled")}
            </h3>

            <p>
              ${escapeHtml(item.description || "")}
            </p>

            ${
              item.link
                ? `<a class="link"
                    href="${item.link}"
                    target="_blank"
                    rel="noopener noreferrer">
                    Read source →
                   </a>`
                : ""
            }

          </article>
        `).join("");

      } catch (error) {
        status.innerHTML =
          '<div class="error">Unable to load AI Radar data.</div>';

        console.error(error);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadRadar();
  </script>

</body>
</html>
