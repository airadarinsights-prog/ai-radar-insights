<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Radar Insights</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      background: #f5f7fa;
      color: #111;
    }

    h1 { margin-bottom: 5px; }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .status, .insight, .news {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .insight {
      border-left: 4px solid #222;
    }

    .insight h3 {
      margin-top: 0;
    }

    .label {
      font-weight: bold;
      margin-top: 12px;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .source {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .news h3 {
      margin: 5px 0 10px;
    }

    .news p {
      color: #444;
      line-height: 1.5;
    }

    a {
      font-weight: bold;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <h1>AI Radar Insights</h1>

  <p class="subtitle">
    Automated AI trends, tools and insights.
  </p>

  <div id="status" class="status">
    Loading latest AI Radar...
  </div>

  <h2>Today's AI Radar — 5 Insights</h2>

  <div id="insights"></div>

  <h2>Latest AI News</h2>

  <div id="news" class="news-grid"></div>

  <script>
    async function loadRadar() {
      const status = document.getElementById("status");
      const insightsBox = document.getElementById("insights");
      const newsBox = document.getElementById("news");

      try {
        const response = await fetch("/api/radar");
        const data = await response.json();

        if (!data.success) {
          throw new Error("Radar API failed");
        }

        status.textContent =
          "Live sources: " + (data.count || 0) + " items collected";

        renderInsights(data.insights || "");
        renderNews(data.items || []);

      } catch (error) {
        status.innerHTML =
          '<span class="error">Unable to load AI Radar data.</span>';

        console.error(error);
      }
    }

    function renderInsights(text) {
      const box = document.getElementById("insights");

      const cleaned = String(text)
        .replace(/\\n/g, "\n")
        .replace(/^Insights:\s*/i, "")
        .trim();

      const sections = cleaned
        .split(/\n(?=\s*\d+\.\s)/)
        .filter(Boolean);

      if (sections.length === 0) {
        box.innerHTML = "<p>Insights are being generated...</p>";
        return;
      }

      box.innerHTML = sections.slice(0, 5).map((section, index) => {

        const content = section
          .replace(/^\s*\d+\.\s*/, "")
          .trim();

        const trend = getPart(content, "Trend");
        const why = getPart(content, "Why it matters");
        const next = getPart(content, "What to watch next");

        return `
          <article class="insight">
            <h3>${index + 1}. ${escapeHtml(trend || content)}</h3>

            ${why ? `
              <div class="label">Why it matters</div>
              <div>${escapeHtml(why)}</div>
            ` : ""}

            ${next ? `
              <div class="label">What to watch next</div>
              <div>${escapeHtml(next)}</div>
            ` : ""}
          </article>
        `;
      }).join("");
    }

    function getPart(text, label) {
      const regex = new RegExp(
        "\\*?" + label + "\\*?\\s*[:\\-]?\\s*([\\s\\S]*?)(?=\\n\\s*\\*?(?:Trend|Why it matters|What to watch next)\\*?\\s*[:\\-]?|$)",
        "i"
      );

      const match = text.match(regex);
      return match ? match[1].trim() : "";
    }

    function renderNews(items) {
      const box = document.getElementById("news");

      box.innerHTML = items.slice(0, 15).map(item => `
        <article class="news">

          <div class="source">
            ${escapeHtml(item.source || "AI Radar")}
          </div>

          <h3>
            ${escapeHtml(item.title || "Untitled")}
          </h3>

          <p>
            ${escapeHtml(item.description || "")}
          </p>

          ${
            item.link
              ? `<a href="${escapeHtml(item.link)}"
                    target="_blank"
                    rel="noopener noreferrer">
                    Read source →
                 </a>`
              : ""
          }

        </article>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadRadar();
  </script>

</body>
</html>
